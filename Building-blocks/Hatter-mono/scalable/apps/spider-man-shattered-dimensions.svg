<?xml version="1.0" encoding="UTF-8"?>
<svg
 width="128"
 height="128"
 viewBox="0 0 128 128"
 xmlns="http://www.w3.org/2000/svg"
 xmlns:xlink="http://www.w3.org/1999/xlink">

<defs>

<linearGradient
 id="bg"
 x1="0%"
 y1="0%"
 x2="0%"
 y2="100%">
 <stop offset="0%" stop-color="#9f9f9f"/>
 <stop offset="100%" stop-color="#808080"/>
</linearGradient>

<filter
 id="shadow"
 x="-0.1"
 y="-0.1"
 width="1.2"
 height="1.2">
 <feGaussianBlur stdDeviation="2.24"/>
</filter>

<clipPath id="roundedClip">
 <rect
   x="8"
   y="8"
   width="112"
   height="112"
   rx="26"
   ry="26"/>
</clipPath>

</defs>

<rect
 x="8"
 y="10.624"
 width="112"
 height="112"
 rx="26"
 ry="26"
 fill="#000000"
 opacity="0.25"
 filter="url(#shadow)"/>




  <image
      x="8"
      y="8"
      width="112"
      height="112"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#roundedClip)"
      xlink:href="data:image/png;base64,"/>


</svg>
